<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none';">
    <title></title>
    <link rel="stylesheet" href="selection-result.css">
  </head>
  <body class="result-body">
    <div class="result-shell">
      <header class="result-header"><h1 id="title"></h1><button id="close" type="button">×</button></header>
      <main class="result-main">
        <form id="language-form" hidden>
          <label class="field-label" for="language" id="language-label"></label>
          <div class="input-row"><select id="language-select"></select><input id="language" maxlength="80" autocomplete="off" hidden><button id="translate-again" type="submit"></button></div>
        </form>
        <div id="model-row" hidden>
          <label class="field-label" for="model-select" id="model-label"></label>
          <select id="model-select"></select>
        </div>
        <form id="article-form" hidden>
          <label class="field-label" for="article-url" id="article-label"></label>
          <div class="input-row"><input id="article-url" type="url" required><button id="fetch" type="submit"></button></div>
          <button id="open-article" type="button"></button>
        </form>
        <section id="article-options" hidden>
          <p id="article-access-hint" class="article-hint"></p>
          <section id="paywall" class="paywall" hidden>
            <p id="paywall-message" class="article-hint"></p>
            <p id="paywall-detail" class="article-hint" hidden></p>
            <ol id="paywall-steps" class="article-hint"><li id="paywall-step-1"></li><li id="paywall-step-2"></li><li id="paywall-step-3"></li></ol>
            <div class="result-actions"><button id="paywall-open" type="button"></button><button id="paywall-import" class="primary" type="button"></button></div>
            <details id="paywall-excerpt"><summary id="paywall-preview-label"></summary><div id="paywall-preview"></div></details>
          </section>
          <div class="result-actions"><button id="import-clipboard" type="button"></button><button id="import-pdf" type="button"></button><button id="attach-media" type="button"></button><button id="record-video" type="button"></button></div>
          <p id="media-import-hint" class="article-hint"></p>
          <ul id="media-list" class="media-list" aria-live="polite"></ul>
          <details id="article-import">
            <summary id="article-import-label"></summary>
            <p id="article-import-hint" class="article-hint"></p>
            <form id="import-form">
              <label class="field-label" for="import-title" id="import-title-label"></label><input id="import-title" maxlength="300" required>
              <label class="field-label" for="import-body" id="import-body-label"></label><textarea id="import-body" maxlength="1000000" required></textarea>
              <button id="import-preview" type="submit"></button>
              <p id="import-changed" class="article-hint" role="status" hidden></p>
            </form>
          </details>
        </section>
        <section id="note-form" hidden>
          <label class="field-label" for="note-title" id="note-title-label"></label><input id="note-title" maxlength="300">
          <label class="field-label" for="note-body" id="note-body-label"></label><textarea id="note-body" maxlength="1000000"></textarea>
        </section>
        <details id="original"><summary id="original-label"></summary><pre id="source"></pre></details>
        <div id="error" role="alert" hidden><span id="error-message"></span><details><summary id="details-label"></summary><div id="error-detail"></div></details><button id="settings" type="button"></button></div>
        <div id="thinking" role="status" hidden><img src="selection-thinking.png" alt="" aria-hidden="true"><span id="thinking-label"></span></div>
        <div id="answer"><span id="output"></span><img id="done-image" src="selection-done.png" alt="" aria-hidden="true" hidden></div>
        <p id="media-info" hidden></p>
      </main>
      <footer class="result-footer">
        <span id="model"></span><span id="status" role="status" aria-live="polite"></span>
        <div class="result-actions"><button id="copy" type="button"></button><button id="retry" type="button"></button><button id="stop" type="button" hidden></button><button id="save" class="primary" type="button" hidden></button><button id="save-as" type="button" hidden></button><button id="open-folder" type="button" hidden></button></div>
        <label class="compatibility"><input id="compatibility" type="checkbox" aria-describedby="compatibility-hint"><span id="compatibility-label"></span></label>
        <p id="compatibility-hint" class="article-hint"></p>
      </footer>
    </div>
    <script src="selection-markdown.js"></script>
    <script src="selection-result.js"></script>
  </body>
</html>
